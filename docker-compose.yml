version: '3.8'

services:
  opsflow-saas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsflow-enterprise-saas
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=enterprise-saas-production-key-change-me-in-prod
      - DATABASE_URL=sqlite:////app/opsflow_saas.db
      - PORT=5000
      - WEBHOOK_TIMEOUT_SECONDS=5
    volumes:
      - opsflow_data:/app
      - ./automation_storage:/app/automation_storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  opsflow_data:
    driver: local
