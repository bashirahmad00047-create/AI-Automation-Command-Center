services:
  - type: web
    name: ai-automation-command-center
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: WA_BRIDGE_PORT
        value: "3001"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: GREEN_API_ID_INSTANCE
        sync: false
      - key: GREEN_API_TOKEN_INSTANCE
        sync: false
      - key: GREEN_API_HOST
        value: "https://7107.api.greenapi.com"
