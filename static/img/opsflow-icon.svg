<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22d3ee" />
            <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
        <linearGradient id="secondaryGrad" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#22d3ee" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Background Plate (Optional for app icon, keeping transparent for favicon flexibility, but adding a subtle dark circle) -->
    <circle cx="256" cy="256" r="240" fill="#060b14" stroke="#111b30" stroke-width="16" />
    
    <!-- Workflow Nodes -->
    <!-- Central Hub -->
    <rect x="208" y="208" width="96" height="96" rx="24" fill="url(#primaryGrad)" filter="url(#glow)"/>
    
    <!-- Top Left Node -->
    <circle cx="140" cy="140" r="32" fill="#111b30" stroke="url(#secondaryGrad)" stroke-width="8" />
    <!-- Bottom Left Node -->
    <circle cx="140" cy="372" r="32" fill="#111b30" stroke="url(#primaryGrad)" stroke-width="8" />
    <!-- Top Right Node -->
    <circle cx="372" cy="140" r="32" fill="#111b30" stroke="url(#primaryGrad)" stroke-width="8" />
    <!-- Bottom Right Node -->
    <circle cx="372" cy="372" r="32" fill="#111b30" stroke="url(#secondaryGrad)" stroke-width="8" />

    <!-- Connecting Paths -->
    <path d="M 162 162 L 208 208" stroke="url(#secondaryGrad)" stroke-width="12" stroke-linecap="round" />
    <path d="M 162 350 L 208 304" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" />
    <path d="M 350 162 L 304 208" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" />
    <path d="M 350 350 L 304 304" stroke="url(#secondaryGrad)" stroke-width="12" stroke-linecap="round" />
</svg>
