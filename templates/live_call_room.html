<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BashFlow AI Receptionist | Live Call</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="/static/img/opsflow-icon.svg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #06090e;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
        }
        .call-card {
            width: 100%;
            max-width: 380px;
            height: 92vh;
            max-height: 590px;
            background: #0b0f17;
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 28px;
            box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(16, 185, 129, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            padding: 24px 20px;
        }
        /* Top Section */
        .call-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }
        .lang-pill-wrap {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            padding: 3px;
            margin-bottom: 22px;
        }
        .lang-pill-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-pill-btn.active {
            background: #10b981;
            color: #0b0f17;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
        }
        .call-title {
            font-size: 21px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }
        .call-status-subtitle {
            font-size: 13.5px;
            color: #10b981;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: pulseGreen 1.8s infinite;
        }
        @keyframes pulseGreen {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px #10b981; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }
        /* Center Sound Wave Visualizer: 5 Glowing Green Vertical Bars */
        .call-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .vapi-waves {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 120px;
            cursor: pointer;
            padding: 10px;
        }
        .wave-bar {
            width: 6px;
            height: 18px;
            background: #10b981;
            border-radius: 9999px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
            transition: height 0.15s ease, opacity 0.15s ease;
            opacity: 0.45;
        }
        .vapi-waves.animating .wave-bar {
            opacity: 1;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.95);
        }
        .vapi-waves.animating .wave-bar:nth-child(1) { animation: soundWave 1.0s ease-in-out infinite 0.1s; }
        .vapi-waves.animating .wave-bar:nth-child(2) { animation: soundWave 1.0s ease-in-out infinite 0.25s; }
        .vapi-waves.animating .wave-bar:nth-child(3) { animation: soundWave 1.0s ease-in-out infinite 0.0s; }
        .vapi-waves.animating .wave-bar:nth-child(4) { animation: soundWave 1.0s ease-in-out infinite 0.35s; }
        .vapi-waves.animating .wave-bar:nth-child(5) { animation: soundWave 1.0s ease-in-out infinite 0.18s; }
        @keyframes soundWave {
            0%, 100% { height: 16px; }
            50% { height: 82px; }
        }
        .transcript-preview {
            margin-top: 14px;
            font-size: 13px;
            color: #cbd5e1;
            max-width: 320px;
            line-height: 1.45;
            min-height: 40px;
            max-height: 70px;
            overflow-y: auto;
            text-align: center;
            scrollbar-width: none;
        }
        .transcript-preview::-webkit-scrollbar { display: none; }
        /* Bottom: Exactly 2 Buttons */
        .call-bottom {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            width: 100%;
            padding-bottom: 6px;
        }
        .btn-mute-mic {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #10b981;
            color: #0b0f17;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            transition: all 0.2s ease;
        }
        .btn-mute-mic.muted {
            background: #ef4444;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }
        .btn-end-call-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #ef4444;
            color: #ffffff;
            border: none;
            border-radius: 9999px;
            padding: 16px 36px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
            transition: all 0.2s ease;
        }
        .btn-mute-mic:active, .btn-end-call-pill:active {
            transform: scale(0.95);
        }
        /* Connect Overlay (Initial Tap-to-Unlock for Browser Audio) */
        .connect-overlay {
            position: absolute;
            inset: 0;
            background: #0b0f17;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 50;
            border-radius: 28px;
            cursor: pointer;
        }
        .btn-start-call {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: none;
            border-radius: 9999px;
            padding: 16px 38px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(16, 185, 129, 0.45);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }
        .btn-start-call:active { transform: scale(0.96); }
    </style>
</head>
<body>
    <div class="call-card">
        <!-- Initial Connect Overlay: Captures initial user click to unlock AudioContext -->
        <div id="connectOverlay" class="connect-overlay" onclick="executeJoinFlow(event)">
            <div style="font-size: 56px; margin-bottom: 16px; filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.6));">🎙️</div>
            <h2 style="font-size: 21px; font-weight: 700; color: #f8fafc; margin-bottom: 8px;">BashFlow AI Receptionist</h2>
            <p style="font-size: 13px; color: #94a3b8; max-width: 270px; line-height: 1.5; margin-bottom: 24px;">
                Hands-Free Real-Time Voice Call. Speak naturally in Urdu or English.
            </p>
            <button type="button" class="btn-start-call" id="joinCallBtn" onclick="executeJoinFlow(event)">
                <span>📞</span>
                <span id="joinCallBtnText">Tap to Connect Live Call</span>
            </button>
            <div style="font-size: 11px; color: #64748b; margin-top: 18px;">
                Instant Hands-Free Voice • No Typing Required
            </div>
        </div>

        <!-- Top Header Area -->
        <div class="call-top">
            <!-- Language Selection Pill -->
            <div class="lang-pill-wrap">
                <button type="button" id="btnLangUr" class="lang-pill-btn active" onclick="switchLanguage('ur-PK')">Urdu</button>
                <button type="button" id="btnLangEn" class="lang-pill-btn" onclick="switchLanguage('en-US')">English</button>
            </div>
            <!-- Title -->
            <h1 class="call-title" id="callerHeaderName">BashFlow AI Receptionist</h1>
            <!-- Live Status Subtitle -->
            <div class="call-status-subtitle">
                <span class="status-dot"></span>
                <span id="callStatusLabel">Connecting...</span>
            </div>
        </div>

        <!-- Center Area: 5 Glowing Green Bars Sound Wave Visualizer -->
        <div class="call-center">
            <div class="vapi-waves" id="waveContainer" onclick="interruptAssistant()" title="Tap to interrupt">
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
            </div>
            <!-- Subtitle / Transcript Box for spoken dialogue -->
            <div class="transcript-preview" id="transcriptBox">
                <span>Connecting hands-free stream...</span>
            </div>
            <div id="callTimer" style="font-size: 11px; color: #64748b; margin-top: 8px; font-family: monospace;">00:00</div>
        </div>

        <!-- Bottom Area: Exactly 3 Buttons (Green Mic + Tap to Send + Red End Call Pill) -->
        <div class="call-bottom" style="display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%;">
            <button type="button" id="btnMicMute" class="btn-mute-mic" onclick="toggleMute()" title="Mute/Unmute Mic">
                <span id="micIcon">🎤</span>
            </button>
            <button type="button" id="btnTapToSend" class="btn-tap-send" onclick="forceDispatchTurn()" title="Tap to Send / Speak Now" style="background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none; border-radius: 9999px; padding: 12px 20px; font-weight: 700; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 16px rgba(16, 185, 129, 0.45); transition: transform 0.15s ease;">
                <span>⚡</span>
                <span id="btnTapToSendText">Tap to Send</span>
            </button>
            <button type="button" id="btnEndCall" class="btn-end-call-pill" onclick="endCall()" title="End Call">
                <span>🔴</span>
                <span>End</span>
            </button>
        </div>
    </div>

    <!-- Hidden audio playback elements (Persistent element for mobile browser autoplay unlock) -->
    <audio id="ai-voice-player" playsinline preload="auto" style="display: none;"></audio>
    <audio id="remoteVoicePlayer" playsinline autoplay preload="auto" style="display: none;"></audio>
    <audio id="audioPlayer" preload="auto" style="display: none;"></audio>

    <script>
        // ===================================================================
        // 1. GLOBAL VARIABLES & ZERO-ERROR SHIELD
        // ===================================================================
        window.currentTurnId = 0;
        window.turnId = 0;
        let currentTurnId = 0;
        let turnId = 0;
        window.currentAiAudio = null;
        window.isAiSpeaking = false;
        window.onerror = function() { return true; };
        window.onunhandledrejection = function(e) { if (e && e.preventDefault) e.preventDefault(); return true; };

        // Strict 3-state machine: "LISTENING" | "PROCESSING" | "SPEAKING"
        let STATE = "LISTENING";
        let inFlightRequest = false;
        let currentAbortController = null;

        // Mobile Browser AudioContext & Persistent <audio> Element Unlocker
        const SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
        let isMobileAudioUnlocked = false;
        function unlockMobileAudio() {
            if (isMobileAudioUnlocked) return;
            try {
                const player = document.getElementById('ai-voice-player') || document.getElementById('remoteVoicePlayer');
                if (player) {
                    player.src = SILENT_WAV;
                    const p = player.play();
                    if (p !== undefined) {
                        p.then(() => { player.pause(); player.currentTime = 0; }).catch(() => {});
                    }
                }
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                isMobileAudioUnlocked = true;
                console.log('[Mobile Audio] Persistent audio player successfully unlocked synchronously.');
            } catch (_) {}
        }
        document.addEventListener('touchstart', unlockMobileAudio, { once: true, passive: true });
        document.addEventListener('click', unlockMobileAudio, { once: true, passive: true });

        // Immediate mobile browser speech fallback (activated only if HTML5 audio fails to play on device)
        function speakWithBrowserFallback(text) {
            if (!text || typeof window === 'undefined' || !window.speechSynthesis) {
                setTimeout(() => { if (isCallActive) setCallState("LISTENING"); }, 300);
                return;
            }
            try {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = currentLanguage || 'ur-PK';
                u.rate = 1.05;
                u.onend = () => {
                    setTimeout(() => { if (isCallActive) setCallState("LISTENING"); }, 300);
                };
                u.onerror = () => {
                    if (isCallActive) setCallState("LISTENING");
                };
                window.speechSynthesis.speak(u);
            } catch (_) {
                if (isCallActive) setCallState("LISTENING");
            }
        }

        // Room ID is kept strictly clean (digits only) on both mobile and dashboard
        const rawPhone = window.location.pathname.split('/call/')[1] || '{{ phone }}' || '';
        const roomId = String(rawPhone).replace(/\D/g, '');
        const phone = roomId;
        window.roomId = roomId;

        let socket = null;
        try {
            if (typeof io !== 'undefined') {
                socket = io();
            }
        } catch (_) {}

        let isCallActive = false;
        let isMuted = false;
        let isAiSpeaking = false;
        let isWaitingForServer = false;
        let latestInterimTranscript = '';
        let accumulatedCustomerSpeech = '';
        const playedChunkIds = new Set();
        let currentLanguage = 'ur-PK';
        let callSeconds = 0;
        let timerInterval = null;
        let callHistory = [];
        let lastSpokenText = '';
        let lastSpokenTime = 0;

        let audioCtx = null;
        let currentAudioSource = null;
        let micStream = null;
        let micAnalyser = null;

        let mediaRecorder = null;
        let recordedAudioChunks = [];
        let isVADRecording = false;
        let vadInterval = null;
        let silenceDurationMs = 0;
        let userHasSpoken = false;

        let speechDebounceTimer = null;
        let recognition = null;

        function setHardwareMicEnabled(enabled) {
            if (micStream && micStream.getAudioTracks) {
                micStream.getAudioTracks().forEach(t => {
                    try { t.enabled = Boolean(enabled); } catch (_) {}
                });
            }
        }

        function setStatus(text) {
            const el = document.getElementById('callStatusLabel');
            if (el) el.textContent = text;
        }

        function setWaveAnimation(animating) {
            const wc = document.getElementById('waveContainer');
            if (wc) wc.classList.toggle('animating', Boolean(animating));
        }

        function setCallState(newState) {
            STATE = newState;
            if (STATE === "LISTENING") {
                setStatus('Listening...');
                setWaveAnimation(false);
                setHardwareMicEnabled(true);
                inFlightRequest = false;
                window.isAiSpeaking = false;
                isAiSpeaking = false;
                isWaitingForServer = false;
                if (mediaRecorder && mediaRecorder.state === 'inactive') {
                    recordedAudioChunks = [];
                    try {
                        mediaRecorder.start(200);
                        isVADRecording = true;
                    } catch (_) {}
                }
            } else if (STATE === "PROCESSING") {
                setStatus('Thinking...');
                setWaveAnimation(false);
                setHardwareMicEnabled(false);
                inFlightRequest = true;
                isWaitingForServer = true;
            } else if (STATE === "SPEAKING") {
                setStatus('Assistant Speaking...');
                setWaveAnimation(true);
                setHardwareMicEnabled(false);
                window.isAiSpeaking = true;
                isAiSpeaking = true;
                isWaitingForServer = false;
            }
        }

        function stopIncomingAiAudio() {
            if (window.currentAiAudio) {
                try {
                    window.currentAiAudio.pause();
                    window.currentAiAudio.currentTime = 0;
                    window.currentAiAudio.src = "";
                    window.currentAiAudio.load();
                } catch (_) {}
                window.currentAiAudio = null;
            }
            const p1 = document.getElementById('remoteVoicePlayer');
            const p2 = document.getElementById('audioPlayer');
            [p1, p2].forEach(p => {
                if (p) {
                    try {
                        p.pause();
                        p.currentTime = 0;
                        p.src = "";
                    } catch (_) {}
                }
            });
            if (window.speechSynthesis) {
                try { window.speechSynthesis.cancel(); } catch (_) {}
            }
            if (currentAudioSource) {
                try { currentAudioSource.stop(); } catch (_) {}
                currentAudioSource = null;
            }
            window.isAiSpeaking = false;
            isAiSpeaking = false;
            isWaitingForServer = false;
            setWaveAnimation(false);
        }

        function interruptAssistant() {
            if (isAiSpeaking) {
                stopIncomingAiAudio();
                setStatus('Listening...');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // ===================================================================
        // 2. AUDIO QUEUE & BUFFER FOR DASHBOARD-MOBILE STREAMING (800ms)
        // ===================================================================
        let customerAudioQueue = [];
        let isPlayingCustomerQueue = false;
        let lastCustomerSeqId = 0;
        let customerAudioPollInterval = null;

        function unlockPersistentRemotePlayer() {
            unlockMobileAudio();
            const player = document.getElementById('ai-voice-player') || document.getElementById('remoteVoicePlayer') || document.getElementById('audioPlayer');
            if (!player) return;
            try {
                player.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
                const p = player.play();
                if (p !== undefined) {
                    p.then(() => {
                        player.pause();
                        player.currentTime = 0;
                    }).catch(() => {});
                }
            } catch (_) {}
        }

        let lastPlayedSeq = 0;
        function enqueueCustomerAudioChunk(chunk) {
            if (!chunk) return;
            const seqNum = typeof chunk.seq === 'number' ? chunk.seq : (typeof chunk.seq_id === 'number' ? chunk.seq_id : null);
            if (seqNum !== null) {
                if (seqNum <= lastCustomerSeqId) return;
                lastCustomerSeqId = seqNum;
            }
            const textData = chunk.text || '';
            if (textData && chunk.sender !== 'customer') {
                const tb = document.getElementById('transcriptBox');
                if (tb) {
                    tb.innerHTML = `<span style="color:#10b981;"><b>Assistant:</b> ${escapeHtml(textData)}</span>`;
                }
            }
            // Audio playback via customerAudioQueue is strictly disabled in live call room
            // The live voice engine handles direct 2-way turn playback without mixing
        }

        function processCustomerAudioQueue() {}

        function startCustomerCallAudioPolling(phoneNum) {
            if (customerAudioPollInterval) clearInterval(customerAudioPollInterval);
            customerAudioPollInterval = setInterval(async () => {
                if (!isCallActive || !phoneNum) return;
                try {
                    const res = await fetch(`/api/call/audio/${encodeURIComponent(phoneNum)}?since_seq=${lastCustomerSeqId}&role=customer&t=${Date.now()}`);
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.success && Array.isArray(data.chunks)) {
                        data.chunks.forEach(c => {
                            if (c.sender !== 'customer') {
                                enqueueCustomerAudioChunk(c);
                            }
                        });
                    }
                } catch (_) {}
            }, 800);
        }

        function broadcastLiveCallChunk(sender, audioPayload, textPayload, mime, seqNum) {
            const targetPhone = roomId || phone;
            if (!targetPhone) return;
            const sNum = typeof seqNum === 'number' ? seqNum : currentTurnId;
            const chunkData = {
                roomId: targetPhone,
                phone: targetPhone,
                seq: sNum,
                seq_id: sNum,
                sender: sender || 'customer',
                audio: audioPayload || '',
                text: textPayload || '',
                mimeType: mime || 'audio/webm'
            };
            if (socket && socket.emit) {
                try {
                    socket.emit('live-call-chunk', {
                        roomId: targetPhone,
                        phone: targetPhone,
                        seq: sNum,
                        seq_id: sNum,
                        chunk: chunkData,
                        ...chunkData
                    });
                } catch (_) {}
            }
            fetch(`/api/call/voice/${encodeURIComponent(targetPhone)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(chunkData)
            }).catch(() => {
                fetch(`/api/call/audio/${encodeURIComponent(targetPhone)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(chunkData)
                }).catch(() => {});
            });
        }

        // ===================================================================
        // 3. EXECUTE JOIN FLOW & HANDS-FREE AUTO START
        // ===================================================================
        function executeJoinFlow(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            unlockMobileAudio();
            if (isCallActive) return;

            const overlay = document.getElementById('connectOverlay');
            if (overlay) overlay.style.display = 'none';

            isCallActive = true;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (_) {}
            unlockPersistentRemotePlayer();
            startCustomerCallAudioPolling(roomId || phone);
            startTimer();
            setStatus('Connecting...');

            fetchGreeting();

            const targetPhone = roomId || phone;
            if (targetPhone) {
                fetch('/api/call/join/' + encodeURIComponent(targetPhone), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: targetPhone, roomId: roomId })
                }).catch(() => {});
            }

            if (socket) {
                if (socket.emit) {
                    try {
                        socket.emit('join-call-room', { roomId: roomId, role: 'customer' });
                    } catch (_) {}
                }
                if (!socket._boundAudioBridgeEvents && socket.on) {
                    socket._boundAudioBridgeEvents = true;
                    socket.on('live-call-chunk', (data) => {
                        const chunk = data?.chunk || data;
                        if (chunk && chunk.sender !== 'customer') {
                            enqueueCustomerAudioChunk(chunk);
                        }
                    });
                }
            }

            setupDualMicPipeline();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            callSeconds = 0;
            const timerEl = document.getElementById('callTimer');
            timerInterval = setInterval(() => {
                callSeconds++;
                const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
                const secs = String(callSeconds % 60).padStart(2, '0');
                if (timerEl) timerEl.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById('btnMicMute');
            const icon = document.getElementById('micIcon');
            if (btn) btn.classList.toggle('muted', isMuted);
            if (icon) icon.textContent = isMuted ? '🔇' : '🎤';
            if (isMuted) {
                setStatus('Muted');
                setWaveAnimation(false);
            } else {
                setStatus('Listening...');
            }
        }

        function endCall() {
            isCallActive = false;
            stopTimer();
            stopIncomingAiAudio();

            if (vadInterval) {
                clearInterval(vadInterval);
                vadInterval = null;
            }

            if (customerAudioPollInterval) {
                clearInterval(customerAudioPollInterval);
                customerAudioPollInterval = null;
            }

            if (micStream) {
                try { micStream.getTracks().forEach(t => t.stop()); } catch (_) {}
                micStream = null;
            }

            const targetPhone = roomId || phone;
            if (targetPhone) {
                fetch('/api/call/end/' + encodeURIComponent(targetPhone), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: targetPhone, roomId: roomId })
                }).catch(() => {});
            }

            setStatus('Call Ended');
            const overlay = document.getElementById('connectOverlay');
            if (overlay) {
                overlay.style.display = 'flex';
                overlay.innerHTML = `
                    <div style="font-size: 50px; margin-bottom: 14px;">👋</div>
                    <h2 style="font-size: 20px; font-weight: 700; color: #f8fafc; margin-bottom: 8px;">Call Ended</h2>
                    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Thank you for calling BashFlow AI Receptionist.</p>
                    <button type="button" class="btn-start-call" onclick="window.location.reload()">
                        <span>📞</span>
                        <span>Call Again</span>
                    </button>
                `;
            }
        }

        function switchLanguage(lang) {
            currentLanguage = lang;
            const btnUr = document.getElementById('btnLangUr');
            const btnEn = document.getElementById('btnLangEn');
            if (btnUr) btnUr.classList.toggle('active', lang === 'ur-PK');
            if (btnEn) btnEn.classList.toggle('active', lang === 'en-US');
            if (window.recognition) {
                try {
                    window.recognition.lang = lang;
                } catch (_) {}
            }
        }

        // ===================================================================
        // 4. OPENING GREETING
        // ===================================================================
        async function fetchGreeting() {
            try {
                const res = await fetch('/api/v1/live-voice-call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        is_greeting: true,
                        persona: 'ur-PK-UzmaNeural',
                        phone: phone
                    })
                });
                const data = await res.json();
                if (data && data.success && isCallActive) {
                    const greeting = data.replyText || data.reply_text || 'Assalam-o-Alaikum! Main BashFlow AI hoon, farmaiye main aapki kya madad karoon?';
                    callHistory.push({ role: 'assistant', text: greeting });

                    const tb = document.getElementById('transcriptBox');
                    if (tb) {
                        tb.innerHTML = `<span style="color:#10b981;"><b>Assistant:</b> ${escapeHtml(greeting)}</span>`;
                    }
                    speakAIResponse(greeting, data.audio_data_uri || data.audioBase64 || data.audio_base64 || '');
                } else {
                    setStatus('Listening...');
                }
            } catch (_) {
                setStatus('Listening...');
            }
        }

        // ===================================================================
        // 5. WEBAUDIO VAD (RMS 100ms) + MEDIA RECORDER LOOP (REAL CALL)
        // ===================================================================
        function setupDualMicPipeline() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    micStream = stream;
                    startWebAudioVADLoop(stream);
                }).catch(() => {
                    setStatus('Listening...');
                });
            }
            startPrimarySpeechRecognition();
        }

        function startWebAudioVADLoop(stream) {
            if (vadInterval) clearInterval(vadInterval);
            silenceDurationMs = 0;
            userHasSpoken = false;

            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                if (!micAnalyser && audioCtx) {
                    const src = audioCtx.createMediaStreamSource(stream);
                    micAnalyser = audioCtx.createAnalyser();
                    micAnalyser.fftSize = 512;
                    src.connect(micAnalyser);
                }
            } catch (_) {}

            function initRecorder() {
                try {
                    let opts = { mimeType: 'audio/webm' };
                    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                        opts = { mimeType: 'audio/webm;codecs=opus' };
                    }
                    mediaRecorder = new MediaRecorder(stream, opts);
                    recordedAudioChunks = [];
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) {
                            recordedAudioChunks.push(e.data);
                        }
                    };
                    mediaRecorder.onstop = () => {
                        if (recordedAudioChunks.length > 0 && isCallActive && !isMuted) {
                            const audioBlob = new Blob(recordedAudioChunks, { type: 'audio/webm' });
                            recordedAudioChunks = [];
                            if (audioBlob.size > 800) {
                                isWaitingForServer = true;
                                const reader = new FileReader();
                                reader.onloadend = () => {
                                    const b64 = reader.result;
                                    currentTurnId++;
                                    turnId = currentTurnId;
                                    const fullText = (accumulatedCustomerSpeech || latestInterimTranscript || '').trim();
                                    accumulatedCustomerSpeech = '';
                                    latestInterimTranscript = '';
                                    broadcastLiveCallChunk('customer', b64, fullText || null, 'audio/webm', currentTurnId);
                                    sendLiveVoicePayload({ audioBase64: b64, customer_audio_base64: b64, text: fullText || null, turnId: currentTurnId, seq: currentTurnId });
                                };
                                reader.readAsDataURL(audioBlob);
                            }
                        }
                    };
                } catch (_) {}
            }

            initRecorder();

            const pcmData = new Float32Array(micAnalyser ? micAnalyser.fftSize : 256);

            vadInterval = setInterval(() => {
                if (!isCallActive || isMuted) return;
                // Strict 3-state check: ignore all VAD input when not in LISTENING state
                if (STATE !== "LISTENING" || inFlightRequest) {
                    silenceDurationMs = 0;
                    userHasSpoken = false;
                    return;
                }

                let rms = 0;
                if (micAnalyser) {
                    micAnalyser.getFloatTimeDomainData(pcmData);
                    let sum = 0;
                    for (let i = 0; i < pcmData.length; i++) {
                        sum += pcmData[i] * pcmData[i];
                    }
                    rms = Math.sqrt(sum / pcmData.length);
                }

                if (rms > 0.02) {
                    setStatus('Listening to you...');
                    setWaveAnimation(true);
                    if (!userHasSpoken) {
                        userHasSpoken = true;
                        window.speechStartEpoch = Date.now();
                    }
                    silenceDurationMs = 0;

                    if (mediaRecorder && mediaRecorder.state !== 'recording') {
                        recordedAudioChunks = [];
                        try {
                            mediaRecorder.start(200);
                            isVADRecording = true;
                        } catch (_) {}
                    }
                } else {
                    if (userHasSpoken) {
                        silenceDurationMs += 100;
                        // Strict 1.8s (1800ms) continuous silence threshold: customer has completed their thought
                        if (silenceDurationMs >= 1800) {
                            userHasSpoken = false;
                            silenceDurationMs = 0;
                            if (STATE !== "LISTENING" || inFlightRequest) return;

                            // 1.8s continuous silence reached: advance to PROCESSING and lock hardware mic
                            setCallState("PROCESSING");

                            if (mediaRecorder && mediaRecorder.state === 'recording') {
                                try {
                                    mediaRecorder.stop();
                                } catch (_) {}
                            } else {
                                const fullText = (accumulatedCustomerSpeech || latestInterimTranscript || '').trim();
                                if (fullText) {
                                    sendLiveVoicePayload({ text: fullText, turnId: ++currentTurnId });
                                    accumulatedCustomerSpeech = '';
                                    latestInterimTranscript = '';
                                } else {
                                    setCallState("LISTENING");
                                }
                            }
                        }
                    } else if (STATE === "LISTENING") {
                        setWaveAnimation(false);
                        setStatus('Listening...');
                    }
                }
            }, 100);
        }

        // ===================================================================
        // 6. SPEECH RECOGNITION (WEB SPEECH API FALLBACK / COMPANION)
        // ===================================================================
        let isRecognitionRunning = false;

        function startPrimarySpeechRecognition() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) return;

            try {
                recognition = new SpeechRec();
                window.recognition = recognition;
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = currentLanguage;

                recognition.onstart = () => {
                    isRecognitionRunning = true;
                };

                recognition.onresult = (event) => {
                    if (isMuted || !isCallActive || STATE !== "LISTENING" || inFlightRequest) return;

                    let interimTranscript = '';
                    let finalTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }

                    if (finalTranscript && finalTranscript.trim()) {
                        accumulatedCustomerSpeech = (accumulatedCustomerSpeech + ' ' + finalTranscript.trim()).trim();
                    }

                    const liveSpeech = (accumulatedCustomerSpeech + (interimTranscript ? ' ' + interimTranscript.trim() : '')).trim();
                    if (liveSpeech) {
                        latestInterimTranscript = liveSpeech;
                        userHasSpoken = true;
                        silenceDurationMs = 0; // Customer is speaking: reset silence timer!
                        setWaveAnimation(true);
                        setStatus('Listening to you...');
                        const tb = document.getElementById('transcriptBox');
                        if (tb) {
                            tb.innerHTML = `<span style="color:#cbd5e1;"><b>You:</b> ${escapeHtml(liveSpeech)}</span>`;
                        }
                    }
                };

                recognition.onerror = () => {};

                recognition.onend = () => {
                    isRecognitionRunning = false;
                    if (isCallActive && !isMuted) {
                        setTimeout(() => {
                            try { recognition.start(); } catch (_) {}
                        }, 250);
                    }
                };

                recognition.start();
            } catch (_) {}
        }

        // ===================================================================
        // 7. ULTRA-FAST SEND TO /api/call/voice & /api/v1/live-voice-call
        // ===================================================================
        async function sendLiveVoicePayload(payload) {
            if (!isCallActive) return;
            setCallState("PROCESSING");

            if (currentAbortController) {
                try { currentAbortController.abort(); } catch (_) {}
            }
            currentAbortController = new AbortController();

            let textQuery = '';
            if (payload && typeof payload === 'object') {
                if (payload.text) textQuery = String(payload.text).trim();
            }

            if (textQuery) {
                const now = Date.now();
                if (textQuery === lastSpokenText && (now - lastSpokenTime) < 1400) {
                    setCallState("LISTENING");
                    return;
                }
                lastSpokenText = textQuery;
                lastSpokenTime = now;
                callHistory.push({ role: 'user', text: textQuery });
            }

            try {
                const custAudio = payload?.customer_audio_base64 || payload?.audioBase64 || payload?.audio_base64 || undefined;
                const bodyData = {
                    persona: 'ur-PK-UzmaNeural',
                    rate: '+8%',
                    callHistory: callHistory.slice(-6),
                    phone: phone || roomId,
                    roomId: roomId || phone,
                    message: textQuery || payload?.text || undefined,
                    audio_base64: custAudio,
                    audioBase64: custAudio,
                    customer_audio_base64: custAudio
                };
                if (payload.text) bodyData.text = payload.text;

                let data = null;
                try {
                    const res = await fetch('/api/v1/voice/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(bodyData),
                        signal: currentAbortController.signal
                    });
                    if (res.ok) {
                        data = await res.json();
                    }
                } catch (firstErr) {
                    if (firstErr.name === 'AbortError') return;
                }

                if (!data || !data.success) {
                    const fallbackRes = await fetch('/api/v1/live-voice-call', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(bodyData),
                        signal: currentAbortController.signal
                    });
                    if (fallbackRes.ok) {
                        data = await fallbackRes.json();
                    }
                }

                if (!isCallActive) return;

                if (data && data.success) {
                    if (data.empty_turn) {
                        setCallState("LISTENING");
                        return;
                    }
                    const reply = data.reply_text || data.replyText || data.reply || 'Jee bilkul.';
                    lastAiSpokenReply = reply;
                    callHistory.push({ role: 'assistant', text: reply });

                    const tb = document.getElementById('transcriptBox');
                    if (tb) {
                        tb.innerHTML = `<span style="color:#10b981;"><b>Assistant:</b> ${escapeHtml(reply)}</span>`;
                    }

                    const outAudioB64 = data.audio_data_uri || data.audioBase64 || data.audio_base64 || '';
                    playNeuralVoiceResponse(outAudioB64);
                } else {
                    setCallState("LISTENING");
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    setCallState("LISTENING");
                }
            }
        }

        // BUG 4: Tap to Send / Speak Now push-to-talk override function
        function forceDispatchTurn() {
            if (STATE === "SPEAKING") return;
            unlockMobileAudio();
            userHasSpoken = false;
            silenceDurationMs = 0;
            setCallState("PROCESSING");
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                try { mediaRecorder.stop(); } catch (_) {}
            } else {
                const fullText = (accumulatedCustomerSpeech || latestInterimTranscript || '').trim();
                if (fullText) {
                    sendLiveVoicePayload({ text: fullText, turnId: ++currentTurnId });
                    accumulatedCustomerSpeech = '';
                    latestInterimTranscript = '';
                } else {
                    setCallState("LISTENING");
                }
            }
        }
        window.forceDispatchTurn = forceDispatchTurn;

        // ===================================================================
        // 8. STRICT SINGLETON NEURAL VOICE PLAYBACK (BUG 3: MOBILE AUDIO PLAYER)
        // ===================================================================
        let lastAiSpokenReply = "Jee bilkul.";

        function playNeuralVoiceResponse(audioBase64) {
            if (!isCallActive) return;
            setCallState("SPEAKING");

            // Global audio singleton: stop and destroy any previous audio
            if (window.currentAiAudio) {
                try {
                    window.currentAiAudio.pause();
                    window.currentAiAudio.currentTime = 0;
                    window.currentAiAudio.src = "";
                } catch (_) {}
                window.currentAiAudio = null;
            }

            if (!audioBase64 || !String(audioBase64).trim()) {
                speakWithBrowserFallback(lastAiSpokenReply);
                return;
            }

            const b64 = String(audioBase64).trim();
            let mime = 'audio/mp3';
            if (b64.startsWith('GkXf')) mime = 'audio/webm';
            else if (b64.startsWith('UklG')) mime = 'audio/wav';

            const uri = b64.startsWith('data:') ? b64 : (`data:${mime};base64,` + b64);
            // BUG 3: Always reuse persistent ai-voice-player DOM element
            const player = document.getElementById('ai-voice-player') || document.getElementById('remoteVoicePlayer');
            window.currentAiAudio = player;
            window.isAiSpeaking = true;

            const onDone = () => {
                if (player) {
                    player.onended = null;
                    player.onerror = null;
                }
                window.currentAiAudio = null;
                window.isAiSpeaking = false;
                setWaveAnimation(false);
                setStatus('Listening...');

                // Hard Mic Lock: wait 300ms to 350ms before re-enabling mic track to prevent room echo
                setTimeout(() => {
                    if (isCallActive) {
                        setCallState("LISTENING");
                    }
                }, 300);
            };

            if (player) {
                player.onended = onDone;
                player.onerror = () => {
                    console.warn('[Mobile HTML5 Audio Error, falling back to speech synthesis]');
                    speakWithBrowserFallback(lastAiSpokenReply);
                };
                player.src = uri;
                player.currentTime = 0;

                const playPromise = player.play();
                if (playPromise !== undefined) {
                    playPromise.catch((err) => {
                        console.warn('[Mobile Audio Autoplay blocked, falling back to browser speech]', err);
                        speakWithBrowserFallback(lastAiSpokenReply);
                    });
                }
            } else {
                speakWithBrowserFallback(lastAiSpokenReply);
            }
        }

        function speakAIResponse(replyText, audioBase64) {
            playNeuralVoiceResponse(audioBase64);
        }

        function playWithWebAudioBuffer(b64, fallbackText) {
            try {
                const cleanB64 = b64.replace(/^data:audio\/\w+;base64,/, '');
                const binaryString = window.atob(cleanB64);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                if (audioCtx) {
                    audioCtx.decodeAudioData(bytes.buffer, (buffer) => {
                        if (!isCallActive) return;
                        if (currentAudioSource) {
                            try { currentAudioSource.stop(); } catch (_) {}
                        }
                        const source = audioCtx.createBufferSource();
                        source.buffer = buffer;
                        source.connect(audioCtx.destination);
                        currentAudioSource = source;
                        source.onended = () => {
                            setWaveAnimation(false);
                            setStatus('Listening...');
                            setTimeout(() => {
                                isAiSpeaking = false;
                                isWaitingForServer = false;
                            }, 450);
                        };
                        source.start(0);
                    }, () => fallbackBrowserSpeech(fallbackText));
                    return;
                }
            } catch (_) {}
            fallbackBrowserSpeech(fallbackText);
        }

        function fallbackBrowserSpeech(text) {
            // Speech synthesis speak disabled for 100% single-engine audio playback
            setTimeout(() => {
                isAiSpeaking = false;
                isWaitingForServer = false;
                setStatus('Listening...');
                setWaveAnimation(false);
            }, 450);
        }
    </script>
