<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live AI Voice Call | BashFlow</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="/static/img/opsflow-icon.svg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            overflow: hidden;
        }
        .call-card {
            width: 100%;
            max-width: 380px;
            height: 94vh;
            max-height: 620px;
            background: radial-gradient(circle at 50% 15%, #131d2e 0%, #0b0f19 80%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(20, 184, 166, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }
        /* Header */
        .call-header {
            padding: 16px 20px 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.2);
        }
        .caller-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .pulse-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #14b8a6;
            box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.7);
            animation: pulseTeal 1.8s infinite;
        }
        @keyframes pulseTeal {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(20, 184, 166, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(20, 184, 166, 0); }
        }
        .caller-name {
            font-size: 14px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.2px;
        }
        .call-status {
            font-size: 11.5px;
            color: #94a3b8;
            margin-top: 1px;
        }
        .call-timer {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            font-weight: 700;
            color: #14b8a6;
            background: rgba(20, 184, 166, 0.12);
            border: 1px solid rgba(20, 184, 166, 0.25);
            padding: 2px 7px;
            border-radius: 6px;
        }
        /* Center Area */
        .call-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 14px 18px;
            text-align: center;
        }
        .lang-switch-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
        }
        .lang-chip {
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            font-size: 10.5px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-chip.active {
            background: rgba(20, 184, 166, 0.2);
            border-color: #14b8a6;
            color: #14b8a6;
            font-weight: 700;
        }
        .vapi-waves {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            height: 64px;
            margin-bottom: 10px;
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 14px;
            transition: background 0.2s ease;
        }
        .vapi-waves:hover {
            background: rgba(20, 184, 166, 0.05);
        }
        .wave-bar {
            width: 5px;
            height: 12px;
            background: #14b8a6;
            border-radius: 9999px;
            transition: height 0.2s ease, opacity 0.2s ease;
            opacity: 0.45;
        }
        .vapi-waves.animating .wave-bar:nth-child(1) { animation: wavePulse 1.0s ease-in-out infinite 0.1s; }
        .vapi-waves.animating .wave-bar:nth-child(2) { animation: wavePulse 1.0s ease-in-out infinite 0.25s; }
        .vapi-waves.animating .wave-bar:nth-child(3) { animation: wavePulse 1.0s ease-in-out infinite 0.0s; }
        .vapi-waves.animating .wave-bar:nth-child(4) { animation: wavePulse 1.0s ease-in-out infinite 0.3s; }
        .vapi-waves.animating .wave-bar:nth-child(5) { animation: wavePulse 1.0s ease-in-out infinite 0.15s; }
        @keyframes wavePulse {
            0%, 100% { height: 10px; opacity: 0.4; }
            50% { height: 54px; opacity: 1; box-shadow: 0 0 16px rgba(20, 184, 166, 0.85); }
        }
        /* Live Mic Volume Meter */
        .vol-meter-wrap {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .vol-meter-bar {
            width: 0%;
            height: 100%;
            background: #14b8a6;
            transition: width 0.06s ease;
            box-shadow: 0 0 8px rgba(20, 184, 166, 0.8);
        }
        /* Subtitles Box */
        .transcript-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 10px 12px;
            min-height: 60px;
            max-height: 90px;
            overflow-y: auto;
            font-size: 12.5px;
            line-height: 1.4;
            color: #cbd5e1;
            text-align: left;
            margin-bottom: 10px;
        }
        /* Push to talk button */
        .btn-ptt {
            width: 100%;
            background: rgba(20, 184, 166, 0.12);
            border: 1px solid rgba(20, 184, 166, 0.35);
            color: #14b8a6;
            font-size: 11.5px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .btn-ptt.recording {
            background: #ef4444 !important;
            border-color: #ef4444 !important;
            color: #ffffff !important;
            animation: pulseTeal 1s infinite;
        }
        /* Text Fallback Row */
        .text-fallback-row {
            width: 100%;
            display: flex;
            gap: 6px;
        }
        .text-fallback-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 6px 10px;
            color: #f8fafc;
            font-size: 11.5px;
            outline: none;
        }
        .text-fallback-btn {
            background: #14b8a6;
            color: #0b0f19;
            border: none;
            border-radius: 8px;
            padding: 0 12px;
            font-weight: 700;
            font-size: 11.5px;
            cursor: pointer;
        }
        /* Bottom Controls */
        .call-footer {
            padding: 12px 18px 16px 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.25);
        }
        .btn-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-mic {
            background: #14b8a6;
            color: #0b0f19;
            box-shadow: 0 4px 14px rgba(20, 184, 166, 0.35);
        }
        .btn-mic.muted {
            background: #ef4444;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
        }
        .btn-end {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #ef4444;
            color: #ffffff;
            border-radius: 9999px;
            padding: 10px 24px;
            font-weight: 700;
            font-size: 13px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4);
            transition: all 0.2s ease;
        }
        .btn-end:active, .btn-mic:active {
            transform: scale(0.95);
        }
        /* Initial Connect Overlay */
        .connect-overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(14px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 50;
        }
        .btn-start-call {
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
            color: #ffffff;
            border: none;
            border-radius: 9999px;
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(20, 184, 166, 0.45);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }
        .btn-start-call:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <div class="call-card">
        <!-- Initial Connect Overlay: Captures explicit user click to unlock AudioContext -->
        <div id="connectOverlay" class="connect-overlay">
            <div style="font-size: 54px; margin-bottom: 16px; animation: pulseTeal 2s infinite;">🎙️</div>
            <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 6px;">BashFlow Live AI Call</h2>
            <p style="font-size: 13px; color: #94a3b8; max-width: 260px; line-height: 1.5; margin-bottom: 24px;">
                Connecting you to our 100% Free Live AI Voice Assistant.
            </p>
            <button type="button" class="btn-start-call" id="joinCallBtn" onclick="startCallFromOverlay()">
                <span>📞</span>
                <span id="joinCallBtnText">Tap to Join Call</span>
            </button>
            <div style="font-size: 11px; color: #64748b; margin-top: 20px;">
                Instant Two-Way Voice • Pakistani Urdu &amp; English
            </div>
        </div>

        <!-- Header -->
        <div class="call-header">
            <div class="caller-info">
                <div class="pulse-dot"></div>
                <div>
                    <div class="caller-name" id="callerHeaderName">BashFlow AI Voice</div>
                    <div class="call-status" id="callStatusLabel">Connecting...</div>
                </div>
            </div>
            <div class="call-timer" id="callTimer">00:00</div>
        </div>

        <!-- Center: Visualizer & Subtitles -->
        <div class="call-body">
            <!-- Language Selection Chips -->
            <div class="lang-switch-row">
                <button type="button" id="btnLangUr" class="lang-chip active" onclick="switchLanguage('ur-PK')">🇵🇰 Urdu (اردو)</button>
                <button type="button" id="btnLangEn" class="lang-chip" onclick="switchLanguage('en-US')">🇬🇧 English</button>
            </div>

            <!-- 5 Wave Bars -->
            <div class="vapi-waves" id="waveContainer" onclick="interruptAssistant()" title="Tap to interrupt assistant">
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
            </div>

            <div id="interruptIndicator" style="display: none; font-size: 10.5px; color: #f59e0b; margin-top: -6px; margin-bottom: 8px; cursor: pointer;" onclick="interruptAssistant()">
                ✋ Tap waves to Interrupt
            </div>

            <!-- Live Mic Volume Meter -->
            <div class="vol-meter-wrap" title="Live Microphone Volume">
                <div id="micVolumeBar" class="vol-meter-bar"></div>
            </div>

            <!-- Subtitle / Transcript Box -->
            <div class="transcript-box" id="transcriptBox">
                <em style="color: #64748b;">Connecting two-way voice stream...</em>
            </div>

            <!-- Hold or Tap to Speak Button -->
            <button type="button" id="btnPushToTalk" class="btn-ptt">
                <span id="pttIcon">🎙️</span>
                <span id="pttText">Hold or Tap to Speak</span>
            </button>

            <!-- Fallback text typing row -->
            <div class="text-fallback-row">
                <input type="text" id="callTextInput" class="text-fallback-input" placeholder="Type here if mic pauses..." onkeydown="if(event.key==='Enter') sendTextInput()">
                <button type="button" class="text-fallback-btn" onclick="sendTextInput()">Send</button>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="call-footer">
            <button type="button" id="btnMicMute" class="btn-circle btn-mic" onclick="toggleMute()" title="Mute/Unmute Mic">
                <span id="micIcon">🎤</span>
            </button>
            <button type="button" id="btnEndCall" class="btn-end" onclick="endCall()" title="End Call">
                <span>🔴</span>
                <span>End Call</span>
            </button>
        </div>
    </div>

    <audio id="audioPlayer" preload="auto" style="display: none;"></audio>

    <script>
        // Room ID is kept strictly clean (digits only) on both mobile and dashboard
        const rawPhone = window.location.pathname.split('/call/')[1] || '{{ phone }}' || '';
        const roomId = String(rawPhone).replace(/\D/g, ''); // '+923209350858' aur '923209350858' dono '923209350858' ban jayenge
        const phone = roomId;
        window.roomId = roomId;

        let socket = null;
        try {
            if (typeof io !== 'undefined') {
                socket = io();
            }
        } catch (_) {}
        let isCallActive = false;
        let isMuted = false;
        let isAiSpeaking = false;
        let currentLanguage = 'ur-PK';
        let callSeconds = 0;
        let timerInterval = null;
        let recognition = null;
        let debounceTimer = null;
        let callHistory = [];
        let audioPlayer = document.getElementById('audioPlayer');
        let lastSpokenText = '';
        let lastSpokenTime = 0;

        // Web Audio Context & Audio Decoding
        let audioCtx = null;
        let currentAudioSource = null;
        let micStream = null;
        let micAnalyser = null;
        let micAnimFrame = null;

        // Dual-Mic MediaRecorder Fallback & VAD
        let mediaRecorder = null;
        let recordedChunks = [];
        let vadSpeechDetected = false;
        let vadSilenceTimer = null;
        let isPttRecording = false;

        function setStatus(text) {
            const el = document.getElementById('callStatusLabel');
            if (el) el.textContent = text;
        }

        function setWaveAnimation(animating) {
            const wc = document.getElementById('waveContainer');
            if (wc) wc.classList.toggle('animating', Boolean(animating));
            const intr = document.getElementById('interruptIndicator');
            if (intr) intr.style.display = animating ? 'block' : 'none';
        }

        function logOnScreenError(msg) {
            console.error('[Voice Call Error]', msg);
            const tb = document.getElementById('transcriptBox');
            if (tb) {
                tb.innerHTML += `<div style="color: #ef4444; font-size: 11px; margin-top: 4px;">⚠️ ${escapeHtml(msg)}</div>`;
                tb.scrollTop = tb.scrollHeight;
            }
        }

        function switchLanguage(lang) {
            currentLanguage = lang;
            const btnUr = document.getElementById('btnLangUr');
            const btnEn = document.getElementById('btnLangEn');
            if (btnUr && btnEn) {
                btnUr.classList.toggle('active', lang === 'ur-PK');
                btnEn.classList.toggle('active', lang === 'en-US');
            }
            if (recognition) {
                recognition.lang = lang;
                try { recognition.stop(); } catch (_) {}
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            callSeconds = 0;
            const timerEl = document.getElementById('callTimer');
            timerInterval = setInterval(() => {
                callSeconds++;
                const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
                const secs = String(callSeconds % 60).padStart(2, '0');
                if (timerEl) timerEl.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
        }

        // ===================================================================
        // 1. UNLOCK BROWSER AUDIO & JOIN CALL (MOBILE TOUCH & CLICK HANDLER)
        // ===================================================================
        function startCustomerListening(stream) {
            const overlay = document.getElementById('connectOverlay');
            if (overlay) overlay.style.display = 'none';

            isCallActive = true;
            startTimer();
            setStatus('🟢 Call Connected. Listening...');

            const tb = document.getElementById('transcriptBox');
            if (tb) {
                tb.innerHTML = '<div style="color: #10b981; font-weight: 600;">🟢 Call Connected. Say "Salam" or speak your question.</div>';
            }

            if (stream) {
                micStream = stream;
                setupMicAnalyser(stream);
                setupMediaRecorderVAD(stream);
                startPrimarySpeechRecognition();
            } else {
                setupDualMicPipeline();
            }
        }
        window.startCustomerListening = startCustomerListening;

        async function executeJoinFlow() {
            const joinBtn = document.getElementById('joinCallBtn');
            const txt = document.getElementById('joinCallBtnText') || joinBtn;
            if (joinBtn) joinBtn.disabled = true;
            if (txt) txt.innerText = 'Connecting...';

            try {
                // Mobile browser ke liye AudioContext unlock karna zaroori hai
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                const silentBuffer = audioCtx.createBuffer(1, 1, 22050);
                const s = audioCtx.createBufferSource();
                s.buffer = silentBuffer;
                s.connect(audioCtx.destination);
                s.start(0);

                if (audioPlayer) {
                    audioPlayer.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
                    audioPlayer.play().then(() => audioPlayer.pause()).catch(() => {});
                }

                // Mic permission mangna
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                // Server ko batana ki customer join ho gaya hai
                if (socket && socket.emit) {
                    socket.emit('join-call-room', { roomId: roomId, role: 'customer' });
                }
                const targetPhone = roomId || phone;
                if (targetPhone) {
                    fetch('/api/call/join/' + encodeURIComponent(targetPhone), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone: targetPhone, roomId: roomId })
                    }).catch(err => console.warn('Join report notice:', err));
                }

                // Mic listening start karein
                startCustomerListening(stream);
            } catch (err) {
                console.error('[Mic Permission Error]', err);
                alert('Mic allow karein taake baat ho sake: ' + (err.message || err.name));
                if (joinBtn) joinBtn.disabled = false;
                if (txt) txt.innerText = 'Tap to Join Call';
            }
        }

        function startCallFromOverlay() {
            executeJoinFlow();
        }
        window.startCallFromOverlay = startCallFromOverlay;

        document.addEventListener('DOMContentLoaded', () => {
            const joinBtn = document.getElementById('joinCallBtn');
            if (joinBtn) {
                // Mobile touch aur click dono handle karein
                joinBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    executeJoinFlow();
                });
            }
            // Bind customer End Call button
            const endBtn = document.getElementById('btnEndCall') || document.querySelector('.btn-end');
            if (endBtn) {
                endBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    endCall();
                });
            }
            bindPttButtonEvents();
        });

        // ===================================================================
        // 2. AUDIO PLAYBACK WITH ZERO CORS/AUTOPLAY ISSUES & SPEECH SYNTHESIS FALLBACK
        // ===================================================================
        function ensureAudioUnlocked() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
        }
        document.addEventListener('click', ensureAudioUnlocked, { passive: true });
        document.addEventListener('touchstart', ensureAudioUnlocked, { passive: true });

        function speakAIResponse(replyText, audioBase64 = null) {
            if (!isCallActive) return;

            isAiSpeaking = true;
            setWaveAnimation(true);
            setStatus('🔊 AI Speaking...');
            ensureAudioUnlocked();

            function finishSpeech() {
                isAiSpeaking = false;
                setWaveAnimation(false);
                if (isCallActive) {
                    setStatus('🟢 Listening... (Speak now)');
                    restartRecognition();
                }
            }

            function runSpeechSynthesisFallback() {
                if (!replyText || !('speechSynthesis' in window)) {
                    finishSpeech();
                    return;
                }
                try {
                    window.speechSynthesis.cancel();
                    const utter = new SpeechSynthesisUtterance(replyText);
                    utter.lang = currentLanguage || currentLang || 'ur-PK';
                    utter.rate = 1.0;
                    utter.onend = () => finishSpeech();
                    utter.onerror = () => finishSpeech();
                    window.speechSynthesis.speak(utter);
                } catch (synthErr) {
                    console.warn('[SpeechSynthesis notice]', synthErr);
                    finishSpeech();
                }
            }

            if (audioBase64 && String(audioBase64).trim()) {
                try {
                    if (currentAudioSource) {
                        try { currentAudioSource.pause(); } catch (_) {}
                        currentAudioSource = null;
                    }
                    const cleanB64 = String(audioBase64).trim();
                    const uriToPlay = cleanB64.startsWith('data:') ? cleanB64 : ('data:audio/mp3;base64,' + cleanB64);
                    
                    // Prefer pre-unlocked DOM <audio> element to defeat mobile Autoplay restrictions
                    let player = audioPlayer || document.getElementById('audioPlayer');
                    if (!player) {
                        player = new Audio();
                        document.body.appendChild(player);
                    }
                    currentAudioSource = player;
                    player.muted = isMuted;

                    player.onended = () => finishSpeech();
                    player.onerror = (e) => {
                        console.warn('[DOM Audio error, trying WebAudio buffer decode]', e);
                        playViaWebAudioBuffer(cleanB64.replace(/^data:audio\/\w+;base64,/, ''), replyText, finishSpeech, runSpeechSynthesisFallback);
                    };

                    player.src = uriToPlay;
                    player.currentTime = 0;
                    const playPromise = player.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(playErr => {
                            console.warn('[Audio play rejected by browser autoplay, falling back to WebAudio buffer decode]', playErr);
                            playViaWebAudioBuffer(cleanB64.replace(/^data:audio\/\w+;base64,/, ''), replyText, finishSpeech, runSpeechSynthesisFallback);
                        });
                    }
                } catch (err) {
                    console.warn('[Audio play exception]', err);
                    runSpeechSynthesisFallback();
                }
            } else {
                runSpeechSynthesisFallback();
            }
        }
        window.speakAIResponse = speakAIResponse;

        function playAudioResponse(audioBase64, audioDataUri, replyText = '') {
            const b64 = audioBase64 || (audioDataUri ? audioDataUri.replace(/^data:audio\/\w+;base64,/, '') : '');
            speakAIResponse(replyText || 'Assalam o Alaikum! Main BashFlow AI bol raha hoon.', b64);
        }

        function playViaWebAudioBuffer(b64, replyTextFallback = '', finishSpeechCb = null, fallbackCb = null) {
            if (!b64 || !audioCtx) {
                if (typeof fallbackCb === 'function') fallbackCb();
                else {
                    isAiSpeaking = false;
                    setWaveAnimation(false);
                    setStatus('🟢 Listening... (Speak now)');
                }
                return;
            }
            try {
                ensureAudioUnlocked();
                const binaryString = window.atob(b64);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);

                audioCtx.decodeAudioData(bytes.buffer.slice(0), (buffer) => {
                    if (!isCallActive) return;
                    const source = audioCtx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioCtx.destination);
                    currentAudioSource = source;
                    source.onended = () => {
                        if (typeof finishSpeechCb === 'function') finishSpeechCb();
                        else {
                            isAiSpeaking = false;
                            setWaveAnimation(false);
                            if (isCallActive) {
                                setStatus('🟢 Listening... (Speak now)');
                                restartRecognition();
                            }
                        }
                    };
                    source.start(0);
                }, (decErr) => {
                    console.warn('[WebAudio decode failed, falling back to SpeechSynthesis]', decErr);
                    if (typeof fallbackCb === 'function') fallbackCb();
                    else {
                        isAiSpeaking = false;
                        setWaveAnimation(false);
                        setStatus('🟢 Listening... (Speak now)');
                    }
                });
            } catch (e) {
                console.warn('[WebAudio exception, falling back to SpeechSynthesis]', e);
                if (typeof fallbackCb === 'function') fallbackCb();
                else {
                    isAiSpeaking = false;
                    setWaveAnimation(false);
                    setStatus('🟢 Listening... (Speak now)');
                }
            }
        }

        function interruptAssistant() {
            if (isAiSpeaking) {
                if (currentAudioSource) {
                    try { currentAudioSource.pause(); } catch (_) {}
                    currentAudioSource = null;
                }
                isAiSpeaking = false;
                setWaveAnimation(false);
                setStatus('🟢 Listening... (Speak now)');
                restartRecognition();
            }
        }

        // ===================================================================
        // 3. FETCH OPENING GREETING
        // ===================================================================
        async function fetchGreeting() {
            try {
                const res = await fetch('/api/v1/live-voice-call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        is_greeting: true,
                        persona: 'ur-PK-AsadNeural',
                        phone: phone
                    })
                });
                const data = await res.json();
                if (data && data.success && isCallActive) {
                    const greeting = data.replyText || data.reply_text || 'Assalam o Alaikum! Main BashFlow AI bol raha hoon, main aapki kya madad kar sakta hoon?';
                    callHistory.push({ role: 'assistant', text: greeting });

                    const tb = document.getElementById('transcriptBox');
                    if (tb) {
                        tb.innerHTML = `<div style="color: #14b8a6; font-weight: 600;"><strong>Assistant:</strong> ${escapeHtml(greeting)}</div>`;
                        tb.scrollTop = tb.scrollHeight;
                    }

                    speakAIResponse(greeting, data.audioBase64 || data.audio_base64 || (data.audio_data_uri ? data.audio_data_uri.replace(/^data:audio\/\w+;base64,/, '') : ''));
                } else {
                    const err = (data && data.error) || 'Failed to fetch opening greeting';
                    logOnScreenError(err);
                    setStatus('🟢 Listening... (Speak now)');
                }
            } catch (err) {
                logOnScreenError('Greeting network error: ' + err.message);
                setStatus('🟢 Listening... (Speak now)');
            }
        }

        // ===================================================================
        // 4. DUAL-MIC SYSTEM: SpeechRecognition + MediaRecorder Fallback + VAD
        // ===================================================================
        function setupDualMicPipeline() {
            // A. Start Microphone Stream & Volume Meter + VAD
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    micStream = stream;
                    setupMicrophoneAnalyser(stream);
                    setupMediaRecorderVAD(stream);
                }).catch(err => {
                    console.warn('[Microphone permission notice]:', err && err.message);
                    setStatus('💬 Tap to Speak or Type');
                });
            }

            // B. Primary SpeechRecognition
            startPrimarySpeechRecognition();
        }

        function setupMicrophoneAnalyser(stream) {
            try {
                const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                const src = ctx.createMediaStreamSource(stream);
                micAnalyser = ctx.createAnalyser();
                micAnalyser.fftSize = 256;
                src.connect(micAnalyser);

                const dataArray = new Uint8Array(micAnalyser.frequencyBinCount);
                const volumeBar = document.getElementById('micVolumeBar');

                function updateVolume() {
                    if (!isCallActive) return;
                    micAnalyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    const avgVolume = sum / dataArray.length; // 0 to 255

                    if (volumeBar) {
                        const pct = Math.min(100, Math.round(avgVolume * 2.2));
                        volumeBar.style.width = `${pct}%`;
                    }

                    // VAD Trigger
                    if (!isAiSpeaking && !isMuted) {
                        if (avgVolume > 16) {
                            vadSpeechDetected = true;
                            setStatus('🟢 Listening... (Hearing voice)');
                            clearTimeout(vadSilenceTimer);
                        } else if (vadSpeechDetected) {
                            // Silence detected after speech: trigger VAD dispatch after 1.2s pause
                            if (!vadSilenceTimer) {
                                vadSilenceTimer = setTimeout(() => {
                                    if (vadSpeechDetected && !isAiSpeaking) {
                                        vadSpeechDetected = false;
                                        handleVadSpeechCompletion();
                                    }
                                    vadSilenceTimer = null;
                                }, 1200);
                            }
                        }
                    }

                    micAnimFrame = requestAnimationFrame(updateVolume);
                }
                updateVolume();
            } catch (err) {
                console.warn('[Mic Analyser Notice]', err);
            }
        }

        function setupMediaRecorderVAD(stream) {
            try {
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        recordedChunks.push(e.data);
                    }
                };
                mediaRecorder.start(250);
            } catch (recErr) {
                console.warn('[MediaRecorder Init Notice]', recErr);
            }
        }

        function handleVadSpeechCompletion() {
            // If primary SpeechRecognition already recognized and sent the text, skip
            if (!mediaRecorder || recordedChunks.length === 0) return;
            // If SpeechRecognition produced a recent final transcript in last 1.5s, skip
            if (Date.now() - lastSpokenTime < 1500) {
                recordedChunks = [];
                return;
            }

            const audioBlob = new Blob(recordedChunks, { type: 'audio/webm' });
            recordedChunks = [];
            if (audioBlob.size < 2000) return; // Too small / silence

            const reader = new FileReader();
            reader.onloadend = () => {
                const base64Audio = reader.result;
                sendLiveVoicePayload({ audioBase64: base64Audio });
            };
            reader.readAsDataURL(audioBlob);
        }

        function startPrimarySpeechRecognition() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                console.warn('[Notice] Web Speech API not supported; using MediaRecorder fallback.');
                return;
            }

            try {
                if (recognition) {
                    try { recognition.stop(); } catch (_) {}
                }
                recognition = new SpeechRec();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = currentLanguage;

                recognition.onresult = (event) => {
                    // Ignore mic feedback while AI is speaking
                    if (isAiSpeaking) return;

                    let interim = '';
                    let final = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            final += event.results[i][0].transcript;
                        } else {
                            interim += event.results[i][0].transcript;
                        }
                    }

                    const display = (final || interim).trim();
                    const tb = document.getElementById('transcriptBox');
                    if (tb && display) {
                        tb.innerHTML = `<div style="color: #cbd5e1;"><strong style="color: #38bdf8;">You:</strong> ${escapeHtml(display)}</div>`;
                        tb.scrollTop = tb.scrollHeight;
                    }

                    if (display) {
                        setStatus('🟢 Listening... (Hearing voice)');
                    }

                    clearTimeout(debounceTimer);
                    const finalClean = final.trim();
                    const interimClean = interim.trim();

                    if (finalClean.length > 1) {
                        sendLiveVoicePayload({ text: finalClean });
                    } else if (interimClean.length > 2) {
                        debounceTimer = setTimeout(() => {
                            if (!isAiSpeaking && interimClean.length > 2) {
                                sendLiveVoicePayload({ text: interimClean });
                            }
                        }, 750);
                    }
                };

                recognition.onerror = (e) => {
                    console.warn('[Speech recognition error]', e && e.error);
                    if (e && e.error === 'not-allowed') {
                        setStatus('💬 Tap to Speak or Type');
                    } else {
                        // Auto restart on transient error as long as call is active
                        restartRecognition();
                    }
                };

                recognition.onend = () => {
                    restartRecognition();
                };

                recognition.start();
            } catch (recErr) {
                console.warn('[Speech init notice]', recErr);
            }
        }

        function restartRecognition() {
            if (isCallActive && !isMuted && !isAiSpeaking && recognition) {
                try {
                    recognition.start();
                } catch (_) {}
            }
        }

        // ===================================================================
        // 5. SEND VOICE PAYLOAD (TEXT OR AUDIO BASE64) TO BACKEND
        // ===================================================================
        async function sendLiveVoicePayload(payload) {
            if (!isCallActive || isAiSpeaking) return;
            const textQuery = payload.text ? payload.text.trim() : '';

            if (textQuery) {
                const now = Date.now();
                if (textQuery === lastSpokenText && (now - lastSpokenTime) < 1400) return;
                lastSpokenText = textQuery;
                lastSpokenTime = now;
                callHistory.push({ role: 'user', text: textQuery });
            }

            setStatus('⏳ Thinking...');

            const tb = document.getElementById('transcriptBox');
            if (tb && textQuery) {
                tb.innerHTML = `
                    <div style="margin-bottom: 4px; color: #cbd5e1;"><strong style="color: #38bdf8;">You:</strong> ${escapeHtml(textQuery)}</div>
                    <div style="color: #94a3b8; font-style: italic;">Assistant thinking...</div>
                `;
                tb.scrollTop = tb.scrollHeight;
            }

            try {
                const bodyData = {
                    persona: 'ur-PK-AsadNeural',
                    callHistory: callHistory.slice(-8)
                };
                if (payload.text) bodyData.text = payload.text;
                if (payload.audioBase64) bodyData.audioBase64 = payload.audioBase64;

                const res = await fetch('/api/v1/live-voice-call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                const data = await res.json();
                if (data && data.success && isCallActive) {
                    const reply = data.replyText || data.reply_text || 'Jee bilkul.';
                    callHistory.push({ role: 'assistant', text: reply });

                    if (tb) {
                        const recognizedUser = data.user_text || textQuery || 'Voice input';
                        tb.innerHTML = `
                            <div style="margin-bottom: 4px; color: #cbd5e1;"><strong style="color: #38bdf8;">You:</strong> ${escapeHtml(recognizedUser)}</div>
                            <div style="color: #f8fafc;"><strong style="color: #14b8a6;">Assistant:</strong> ${escapeHtml(reply)}</div>
                        `;
                        tb.scrollTop = tb.scrollHeight;
                    }

                    const outAudioB64 = data.audioBase64 || data.audio_base64 || (data.audio_data_uri ? data.audio_data_uri.replace(/^data:audio/\w+;base64,/, '') : '');
                    speakAIResponse(reply, outAudioB64);
                } else {
                    const errMsg = (data && data.error) || 'Failed to get AI voice response';
                    logOnScreenError(errMsg);
                    setStatus('🟢 Listening... (Speak now)');
                }
            } catch (err) {
                logOnScreenError('Network call error: ' + err.message);
                setStatus('🟢 Listening... (Speak now)');
            }
        }

        // ===================================================================
        // 6. HOLD OR TAP TO SPEAK BUTTON (MOBILE TOUCH & DESKTOP GESTURE PIPELINE)
        // ===================================================================
        let isPttRecording = false;
        let pttTouchStartTime = 0;
        let pttTapMode = false;

        async function ensurePttAudioContextAndMic() {
            try {
                if (audioCtx && audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
            } catch (_) {}

            if (!micStream || !micStream.active) {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    setupMicrophoneAnalyser(micStream);
                    setupMediaRecorderVAD(micStream);
                } catch (micErr) {
                    console.warn('[Microphone Request Error on PTT]', micErr);
                }
            }

            if (!recognition && isCallActive) {
                startPrimarySpeechRecognition();
            } else if (recognition) {
                try { recognition.start(); } catch (_) {}
            }
        }

        async function startPttAction(e) {
            if (e && e.cancelable) e.preventDefault();
            if (!isCallActive || isAiSpeaking) return;

            // Ensure AudioContext and Mic strictly inside user gesture
            await ensurePttAudioContextAndMic();

            isPttRecording = true;
            const btn = document.getElementById('btnPushToTalk');
            const txt = document.getElementById('pttText');
            if (btn) btn.classList.add('recording');
            if (txt) txt.textContent = pttTapMode ? 'Tap to Send' : 'Release or Tap to Send';
            setStatus('🟢 Recording Speech... (Speak now)');

            // Reset recorded chunks and request immediate new chunk from MediaRecorder
            recordedChunks = [];
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                try { mediaRecorder.requestData(); } catch (_) {}
            } else if (mediaRecorder && mediaRecorder.state === 'inactive' && micStream) {
                try { mediaRecorder.start(250); } catch (_) {}
            }
        }

        function stopPttAction(e) {
            if (e && e.cancelable) e.preventDefault();
            if (!isPttRecording) return;
            isPttRecording = false;
            pttTapMode = false;

            const btn = document.getElementById('btnPushToTalk');
            const txt = document.getElementById('pttText');
            if (btn) btn.classList.remove('recording');
            if (txt) txt.textContent = 'Hold or Tap to Speak';
            setStatus('⏳ Processing Speech...');

            if (mediaRecorder && mediaRecorder.state === 'recording') {
                try { mediaRecorder.requestData(); } catch (_) {}
            }

            setTimeout(() => {
                if (recordedChunks.length > 0) {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    recordedChunks = [];
                    if (blob.size >= 800) {
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            sendLiveVoicePayload({ audioBase64: reader.result });
                        };
                        reader.readAsDataURL(blob);
                        return;
                    }
                }
                if (isCallActive) setStatus('🟢 Listening... (Speak now)');
            }, 250);
        }

        function startPttRecord(e) { startPttAction(e); }
        function stopPttRecord(e) { stopPttAction(e); }

        function bindPttButtonEvents() {
            const pttBtn = document.getElementById('btnPushToTalk');
            if (!pttBtn || pttBtn._boundPttEvents) return;
            pttBtn._boundPttEvents = true;

            // Touch events for mobile (iOS Safari / Android Chrome) with { passive: false } and e.preventDefault()
            pttBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                pttTouchStartTime = Date.now();
                if (pttTapMode && isPttRecording) {
                    stopPttAction(e);
                    return;
                }
                startPttAction(e);
            }, { passive: false });

            pttBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                const pressDuration = Date.now() - pttTouchStartTime;
                if (pressDuration < 350) {
                    // Tap toggle mode: stays recording until tapped again
                    pttTapMode = true;
                    const txt = document.getElementById('pttText');
                    if (txt) txt.textContent = 'Tap to Send';
                    setStatus('🟢 Listening... (Tap to Send)');
                    return;
                }
                stopPttAction(e);
            }, { passive: false });

            pttBtn.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                stopPttAction(e);
            }, { passive: false });

            // Desktop mouse events (mousedown / mouseup / mouseleave)
            pttBtn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                pttTouchStartTime = Date.now();
                if (pttTapMode && isPttRecording) {
                    stopPttAction(e);
                    return;
                }
                startPttAction(e);
            });

            pttBtn.addEventListener('mouseup', (e) => {
                e.preventDefault();
                const pressDuration = Date.now() - pttTouchStartTime;
                if (pressDuration < 350) {
                    pttTapMode = true;
                    const txt = document.getElementById('pttText');
                    if (txt) txt.textContent = 'Tap to Send';
                    setStatus('🟢 Listening... (Tap to Send)');
                    return;
                }
                stopPttAction(e);
            });

            pttBtn.addEventListener('mouseleave', () => {
                if (isPttRecording && !pttTapMode) {
                    stopPttAction();
                }
            });
        }

        function sendTextInput() {
            const input = document.getElementById('callTextInput');
            if (!input || !input.value.trim()) return;
            const text = input.value.trim();
            input.value = '';
            sendLiveVoicePayload({ text: text });
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById('btnMicMute');
            const icon = document.getElementById('micIcon');
            if (btn) btn.classList.toggle('muted', isMuted);
            if (icon) icon.textContent = isMuted ? '🔇' : '🎤';
            if (isMuted) {
                if (recognition) { try { recognition.stop(); } catch (_) {} }
                setStatus('Mic Muted');
            } else {
                restartRecognition();
                setStatus(isAiSpeaking ? '🔊 AI Speaking...' : '🟢 Listening... (Speak now)');
            }
        }

        function syncCallEndedBeacon() {
            const targetPhone = roomId || phone;
            if (targetPhone) {
                try {
                    const url = '/api/call/end/' + encodeURIComponent(targetPhone);
                    if (navigator.sendBeacon) {
                        navigator.sendBeacon(url);
                    } else {
                        fetch(url, { method: 'POST', keepalive: true }).catch(() => {});
                    }
                } catch (_) {}
            }
        }

        window.addEventListener('beforeunload', () => {
            syncCallEndedBeacon();
        });

        window.addEventListener('pagehide', () => {
            syncCallEndedBeacon();
        });

        function endCall() {
            syncCallEndedBeacon();
            isCallActive = false;
            isAiSpeaking = false;
            stopTimer();
            setWaveAnimation(false);
            if (micAnimFrame) cancelAnimationFrame(micAnimFrame);
            if (currentAudioSource) {
                try { currentAudioSource.pause(); } catch (_) {}
                currentAudioSource = null;
            }
            if (recognition) {
                try { recognition.stop(); } catch (_) {}
            }
            if (micStream) {
                try { micStream.getTracks().forEach(t => t.stop()); } catch (_) {}
            }
            setStatus('Call Ended');
            const tb = document.getElementById('transcriptBox');
            if (tb) tb.innerHTML = '<div style="color: #ef4444; font-weight: 700; text-align: center; padding-top: 10px;">Call Ended. Thank you!</div>';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[m]));
        }
    </script>
</body>
