<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - BashFlow Cloud Enterprise</title>

    <!-- Progressive Web App (PWA) Manifest & Favicons -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <link rel="icon" type="image/svg+xml" href="/static/img/opsflow-icon.svg">
    <link rel="stylesheet" href="/static/css/style.css?v=2.8.5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #070a13;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-glass: rgba(0, 240, 255, 0.2);
            --cyan-glow: #00f0ff;
            --blue-glow: #3b82f6;
            --accent-pink: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Cybernetic Background */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
        }
        .glow-1 {
            width: 500px;
            height: 500px;
            background: #00f0ff;
            top: -150px;
            left: -100px;
        }
        .glow-2 {
            width: 450px;
            height: 450px;
            background: #3b82f6;
            bottom: -150px;
            right: -100px;
        }
        .glow-3 {
            width: 350px;
            height: 350px;
            background: #8b5cf6;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.15;
        }

        /* Subtle grid pattern overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 240, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-header {
            padding: 32px 32px 24px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, transparent 100%);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .brand-icon-box {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(59, 130, 246, 0.25));
            border: 1px solid rgba(0, 240, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
        }

        .brand-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #ffffff;
            line-height: 1.1;
        }

        .brand-sub {
            font-size: 11px;
            letter-spacing: 0.15em;
            color: var(--cyan-glow);
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            font-weight: 600;
        }

        .login-tagline {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }

        /* Tabs */
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.2);
        }

        .auth-tab {
            flex: 1;
            padding: 14px 16px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .auth-tab.active {
            color: var(--cyan-glow);
            border-bottom-color: var(--cyan-glow);
            background: rgba(0, 240, 255, 0.04);
        }

        .auth-tab:hover:not(.active) {
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.02);
        }

        .login-body {
            padding: 28px 32px 32px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 7px;
            font-size: 12.5px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 13.5px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-input:focus {
            border-color: var(--cyan-glow);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
            background: rgba(15, 23, 42, 0.95);
        }

        .form-input::placeholder {
            color: #64748b;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: #ffffff;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #00f0ff 0%, #3b82f6 100%);
            border: none;
            border-radius: 10px;
            padding: 13px;
            color: #041019;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.35);
            margin-top: 10px;
        }

        .submit-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 240, 255, 0.45);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert-box {
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            margin-bottom: 16px;
            display: none;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-left: 3px solid #ef4444;
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-left: 3px solid #10b981;
            color: #6ee7b7;
        }

        /* Demo credentials box */
        .demo-helpers {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .demo-helpers-title {
            font-size: 11.5px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .demo-pills {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .demo-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .demo-pill:hover {
            background: rgba(0, 240, 255, 0.08);
            border-color: rgba(0, 240, 255, 0.3);
            transform: translateY(-1px);
        }

        .demo-pill-name {
            font-size: 11.5px;
            font-weight: 600;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .demo-pill-role {
            font-size: 10px;
            color: var(--cyan-glow);
            font-family: 'JetBrains Mono', monospace;
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #64748b;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #041019;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>
    <div class="grid-overlay"></div>

    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <div class="brand-badge">
                <div class="brand-icon-box">⚡</div>
                <div>
                    <div class="brand-title">BASHFLOW CLOUD</div>
                    <div class="brand-sub">ENTERPRISE COMMAND CENTER</div>
                </div>
            </div>
            <p class="login-tagline">Secure Authentication & Autonomous Workspace Gateway</p>
        </div>

        <!-- Mode Tabs -->
        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tabSignIn" onclick="switchTab('signin')">
                <span>🔑</span> Sign In
            </button>
            <button type="button" class="auth-tab" id="tabSignUp" onclick="switchTab('signup')">
                <span>✨</span> Create Account
            </button>
        </div>

        <div class="login-body">
            <div id="alertBox" class="alert-box"></div>

            <!-- SIGN IN FORM -->
            <form id="signInForm" onsubmit="handleSignIn(event)">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Work Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="loginEmail" class="form-input" required placeholder="admin@opsflow.io" autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px;">
                        <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
                        <a href="javascript:void(0)" onclick="handleForgotPasswordNotice()" style="font-size: 11.5px; color: var(--cyan-glow); text-decoration: none;">Forgot password?</a>
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="loginPassword" class="form-input" required placeholder="••••••••••••" style="padding-right: 42px;" autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)" title="Toggle password visibility">👁️</button>
                    </div>
                </div>

                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 12.5px; color: #94a3b8;">
                    <input type="checkbox" id="rememberMe" checked style="accent-color: var(--cyan-glow); cursor: pointer;">
                    <label for="rememberMe" style="cursor: pointer;">Remember workspace session for 30 days</label>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span>Sign In to Command Center</span>
                    <span>&rarr;</span>
                </button>
            </form>

            <!-- SIGN UP FORM -->
            <form id="signUpForm" onsubmit="handleSignUp(event)" style="display: none;">
                <div class="form-group">
                    <label class="form-label" for="regFullName">Full Name</label>
                    <input type="text" id="regFullName" class="form-input" required placeholder="Alex Mercer">
                </div>

                <div class="form-group">
                    <label class="form-label" for="regEmail">Work Email Address</label>
                    <input type="email" id="regEmail" class="form-input" required placeholder="alex@company.com">
                </div>

                <div class="form-group">
                    <label class="form-label" for="regOrg">Organization / Company Name</label>
                    <input type="text" id="regOrg" class="form-input" required placeholder="Acme Global Technologies">
                </div>

                <div class="form-group">
                    <label class="form-label" for="regPassword">Password (Min 8 characters)</label>
                    <div class="input-wrapper">
                        <input type="password" id="regPassword" class="form-input" required minlength="8" placeholder="••••••••••••" style="padding-right: 42px;">
                        <button type="button" class="password-toggle" onclick="togglePassword('regPassword', this)" title="Toggle password visibility">👁️</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="regSubmitBtn">
                    <span>Create Enterprise Account</span>
                    <span>&rarr;</span>
                </button>
            </form>

            <div class="footer-note">
                Encrypted Session • Multi-Tenant RBAC • Zero-Trust Perimeter
            </div>
        </div>
    </div>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🔒';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function switchTab(mode) {
            const tabIn = document.getElementById('tabSignIn');
            const tabUp = document.getElementById('tabSignUp');
            const formIn = document.getElementById('signInForm');
            const formUp = document.getElementById('signUpForm');
            const alertBox = document.getElementById('alertBox');
            if (alertBox) alertBox.style.display = 'none';

            if (mode === 'signup') {
                tabUp.classList.add('active');
                tabIn.classList.remove('active');
                formUp.style.display = 'block';
                formIn.style.display = 'none';
            } else {
                tabIn.classList.add('active');
                tabUp.classList.remove('active');
                formIn.style.display = 'block';
                formUp.style.display = 'none';
            }
        }

        function showAlert(msg, isSuccess = false) {
            const el = document.getElementById('alertBox');
            if (!el) return;
            el.className = 'alert-box ' + (isSuccess ? 'alert-success' : 'alert-error');
            el.innerHTML = (isSuccess ? '✓ ' : '⚠️ ') + msg;
            el.style.display = 'block';
        }

        function handleForgotPasswordNotice() {
            showAlert('To reset your password, contact your master workspace administrator or submit a password reset request via admin@opsflow.io.');
        }

        async function handleSignIn(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('submitBtn');
            const originalContent = btn.innerHTML;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> <span>Verifying credentials...</span>';
            const alertBox = document.getElementById('alertBox');
            if (alertBox) alertBox.style.display = 'none';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json().catch(() => ({}));

                if (res.ok && (data.status === 'success' || data.success)) {
                    showAlert('Authentication verified! Entering Command Center...', true);
                    const dest = data.redirect || '/dashboard';
                    setTimeout(() => {
                        window.location.href = dest;
                    }, 400);
                } else {
                    showAlert(data.error || data.message || 'Invalid email or password. Please verify your credentials.');
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                }
            } catch (err) {
                showAlert('Connection error. Please check your network or try again.');
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const full_name = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const organization_name = document.getElementById('regOrg').value.trim();
            const password = document.getElementById('regPassword').value;
            const btn = document.getElementById('regSubmitBtn');
            const originalContent = btn.innerHTML;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> <span>Provisioning account...</span>';

            try {
                const res = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name, email, password, organization_name })
                });

                const data = await res.json().catch(() => ({}));

                if (res.ok && (data.status === 'success' || data.user)) {
                    showAlert('Account created successfully! Redirecting to workspace...', true);
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 600);
                } else {
                    showAlert(data.error || 'Failed to register account. Email may already be registered.');
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                }
            } catch (err) {
                showAlert('Failed to connect to authentication server. Please try again.');
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        }
    </script>
</body>
</html>
